# Windows: copy this file to "basicsplit.toml" and edit it.
# (On macOS the app's Settings window takes care of this.)

# WireGuard profile (path relative to this file)
wireguard = "profile.conf"

# Optional local SOCKS5 proxy (remove the leading # to turn it on)
# listen = "127.0.0.1:1080"

# One rule per program. A domain also covers its subdomains.
# Without "domains", all of the program's TCP traffic goes through the tunnel.
[[rule]]
exe = "chrome.exe"
domains = [
  "wowhead.com",
  "zamimg.com",
]
